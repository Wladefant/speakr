name: OVH Speakr CI

on:
  push:
    branches:
      - master
      - 'fix/**'
      - 'ci/**'
      - 'ovh-ci/**'
  workflow_dispatch:
    inputs:
      target_sha:
        description: Optional 40-hex commit SHA to verify
        required: false
        default: ''
        type: string
      test_files:
        description: Optional space-separated pytest test paths (default runs full suite)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ovh-speakr-ci-${{ github.event_name }}-${{ inputs.target_sha || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, ovh, speakr]
    timeout-minutes: 15

    steps:
      - name: Validate dispatch inputs
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          if [ -n "$TARGET_SHA" ] && ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a 40-character lowercase hex SHA"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 1

      - name: Record exact head and runner diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          python3 --version || true
          node --version || true
          npm --version || true
          command -v uv || true
          ls -d /usr/lib/postgresql/*/bin 2>/dev/null || true

      - name: Start user-space PostgreSQL 16
        id: pg
        shell: bash
        run: |
          set -euo pipefail
          PG_BIN=""
          for candidate in /usr/lib/postgresql/16/bin /usr/lib/postgresql/17/bin /usr/lib/postgresql/*/bin "${HOME}/.cache/speakr-pg16/env/bin"; do
            if [ -x "${candidate}/initdb" ] && [ -x "${candidate}/pg_ctl" ]; then
              PG_BIN="$candidate"
              break
            fi
          done
          if [ -z "$PG_BIN" ] && command -v initdb >/dev/null 2>&1 && command -v pg_ctl >/dev/null 2>&1; then
            PG_BIN="$(dirname "$(command -v initdb)")"
          fi
          if [ -z "$PG_BIN" ]; then
            PG_CACHE="${HOME}/.cache/speakr-pg16"
            mkdir -p "$PG_CACHE"
            if [ ! -x "${PG_CACHE}/micromamba" ]; then
              curl --fail --location --silent --show-error https://micro.mamba.pm/api/micromamba/linux-64/latest                 | tar -xj -C "$PG_CACHE" --strip-components=1 bin/micromamba
            fi
            export MAMBA_ROOT_PREFIX="${PG_CACHE}/mamba-root"
            "${PG_CACHE}/micromamba" create --yes --prefix "${PG_CACHE}/env" --channel conda-forge "postgresql=16"
            PG_BIN="${PG_CACHE}/env/bin"
          fi

          PG_PORT="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          PG_RUN_DIR="${RUNNER_TEMP:-/tmp}/speakr-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PG_DATA="${PG_RUN_DIR}/data"
          PG_SOCK="${PG_RUN_DIR}/sock"
          mkdir -p "$PG_DATA" "$PG_SOCK"

          "${PG_BIN}/initdb" -D "$PG_DATA" -U speakr --auth-local=trust --auth-host=trust >/dev/null
          "${PG_BIN}/pg_ctl" -D "$PG_DATA" -l "${PG_RUN_DIR}/postgres.log"             -o "-h 127.0.0.1 -p ${PG_PORT} -k ${PG_SOCK}" -w start
          "${PG_BIN}/createdb" -h 127.0.0.1 -p "${PG_PORT}" -U speakr speakr_test
          for attempt in $(seq 1 40); do
            if "${PG_BIN}/pg_isready" -h 127.0.0.1 -p "${PG_PORT}" -U speakr -d speakr_test >/dev/null 2>&1; then
              echo "PostgreSQL ready on 127.0.0.1:${PG_PORT} (bin=${PG_BIN})"
              echo "pg_bin=${PG_BIN}" >> "$GITHUB_OUTPUT"
              echo "pg_data=${PG_DATA}" >> "$GITHUB_OUTPUT"
              echo "pg_run_dir=${PG_RUN_DIR}" >> "$GITHUB_OUTPUT"
              echo "port=${PG_PORT}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 1
          done
          echo "::error::PostgreSQL failed to become ready"
          cat "${PG_RUN_DIR}/postgres.log" || true
          exit 1

      - name: Install Python and Node dependencies and run test suites
        shell: bash
        env:
          PG_PORT: ${{ steps.pg.outputs.port }}
          TEST_FILES: ${{ inputs.test_files }}
        run: |
          set -euo pipefail
          export TEST_DATABASE_URI="postgresql+psycopg2://speakr:speakr@127.0.0.1:${PG_PORT}/speakr_test"

          VENV_DIR="${RUNNER_TEMP:-/tmp}/speakr-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv venv --python 3.11 "$VENV_DIR"
          uv pip install --python "${VENV_DIR}/bin/python" -r requirements.txt pytest pytest-cov

          npm install --no-audit --no-fund
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            npm install --no-save --no-package-lock ffmpeg-static@5.2.0 ffprobe-static@3.1.0
            FFMPEG_BIN="$(node -p "require('ffmpeg-static')")"
            FFPROBE_BIN="$(node -p "require('ffprobe-static').path")"
            export PATH="$(dirname "$FFMPEG_BIN"):$(dirname "$FFPROBE_BIN"):$PATH"
          fi
          command -v ffmpeg
          command -v ffprobe

          echo "=== Running pytest ==="
          if [ -n "$TEST_FILES" ]; then
            read -r -a PYTEST_TARGETS <<< "$TEST_FILES"
            "${VENV_DIR}/bin/python" -m pytest "${PYTEST_TARGETS[@]}" -v
          else
            "${VENV_DIR}/bin/python" -m pytest tests/ -q --cov=src --cov-report=term-missing --cov-fail-under=54
          fi

          echo "=== Running npm test (Vitest) ==="
          npm test

          rm -rf "$VENV_DIR"

      - name: Stop user-space PostgreSQL 16
        if: always() && steps.pg.outputs.pg_data != ''
        shell: bash
        env:
          PG_BIN: ${{ steps.pg.outputs.pg_bin }}
          PG_DATA: ${{ steps.pg.outputs.pg_data }}
          PG_RUN_DIR: ${{ steps.pg.outputs.pg_run_dir }}
        run: |
          "${PG_BIN}/pg_ctl" -D "$PG_DATA" -m immediate stop >/dev/null 2>&1 || true
          rm -rf "$PG_RUN_DIR"
